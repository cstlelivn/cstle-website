name: Sync Gallery from Google Drive

on:
  # Run every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  sync-gallery:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync gallery from Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          # SUPABASE_URL intentionally omitted: the SUPABASE_URL secret was set
          # to a malformed value (every request failed with "Invalid path
          # specified in request URL"), and the script already falls back to
          # the correct project URL when this env var is unset.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GDRIVE_GALLERY_ROOT_FOLDER: ${{ secrets.GDRIVE_GALLERY_ROOT_FOLDER }}
        # The npm script wraps this in `tsx --env-file=.env.local`, which is
        # for local dev (loading secrets from a gitignored file) -- in CI the
        # env vars above are already in the process environment, and
        # --env-file requires Node 20.6+ / errors outright on the Node 18
        # this workflow used to pin, so call tsx directly instead of via npm run.
        run: npx tsx src/app/scripts/syncGalleryFromDrive.ts
